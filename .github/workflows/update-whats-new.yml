name: Update What's New Feed

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install xml2js node-fetch@2

      - name: Fetch RSS and Update Firebase
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_SECRET_KEY: ${{ secrets.FIREBASE_SECRET_KEY }}
        run: |
          node -e '
          const fetch = require("node-fetch");
          const xml2js = require("xml2js");

          const parser = new xml2js.Parser({ explicitArray: false });

          // 各メディアの直接RSS/AtomフィードURL
          const FEEDS = [
            { type: "note", url: "https://note.com/andydandystory/rss" },
            { type: "yt-repair", url: "https://www.youtube.com/feeds/videos.xml?channel_id=UCnN8E4C4uQzY0y1g9N1y1A" },
            { type: "yt-talk", url: "https://www.youtube.com/feeds/videos.xml?channel_id=UC6-AwddczjrLZ8VaoW5-_6g" }
          ];

          async function main() {
            let allItems = [];

            for (const feed of FEEDS) {
              try {
                const res = await fetch(feed.url, {
                  headers: { "User-Agent": "Mozilla/5.0" }
                });
                if (!res.ok) continue;
                
                const xml = await res.text();
                const result = await parser.parseStringPromise(xml);

                if (feed.type === "note") {
                  if (!result || !result.rss || !result.rss.channel) continue;
                  const items = result.rss.channel.item || [];
                  const itemList = Array.isArray(items) ? items : [items];
                  
                  itemList.forEach(item => {
                    let thumb = "";
                    if (item["media:thumbnail"]) {
                      thumb = item["media:thumbnail"];
                    } else if (item["media:content"] && item["media:content"].$) {
                      thumb = item["media:content"].$.url;
                    }

                    const pubDate = new Date(item.pubDate);
                    const formattedDate = pubDate.getFullYear() + "/" + 
                      String(pubDate.getMonth() + 1).padStart(2, "0") + "/" + 
                      String(pubDate.getDate()).padStart(2, "0");

                    allItems.push({
                      type: "note",
                      title: item.title,
                      link: item.link,
                      date: formattedDate,
                      timestamp: pubDate.getTime(),
                      thumbUrl: thumb
                    });
                  });
                } else {
                  // YouTube (Atomフィード) - ライブ配信アーカイブも含む
                  if (!result || !result.feed || !result.feed.entry) continue;
                  const entries = result.feed.entry || [];
                  const entryList = Array.isArray(entries) ? entries : [entries];

                  entryList.forEach(entry => {
                    let thumb = "";
                    if (entry["media:group"] && entry["media:group"]["media:thumbnail"]) {
                      thumb = entry["media:group"]["media:thumbnail"].$.url;
                    }

                    const pubDate = new Date(entry.published || entry.updated);
                    const formattedDate = pubDate.getFullYear() + "/" + 
                      String(pubDate.getMonth() + 1).padStart(2, "0") + "/" + 
                      String(pubDate.getDate()).padStart(2, "0");

                    allItems.push({
                      type: feed.type,
                      title: entry.title,
                      link: entry.link.$.href,
                      date: formattedDate,
                      timestamp: pubDate.getTime(),
                      thumbUrl: thumb
                    });
                  });
                }
              } catch (e) {
                console.error("Error fetching feed:", feed.type, e.message);
              }
            }

            // 新しい順に並び替えて最新3件を取得
            allItems.sort((a, b) => b.timestamp - a.timestamp);
            const topItems = allItems.slice(0, 3);

            const dbUrl = process.env.FIREBASE_DATABASE_URL + "/whatsNew.json?auth=" + process.env.FIREBASE_SECRET_KEY;
            
            const putRes = await fetch(dbUrl, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(topItems)
            });

            if (putRes.ok) {
              console.log("Successfully updated whatsNew on Firebase!");
            } else {
              console.error("Firebase update failed:", await putRes.text());
            }
          }

          main();
          '