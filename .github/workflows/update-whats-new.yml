name: Update What's New Feed

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install xml2js node-fetch@2

      - name: Fetch RSS and Update Firebase
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_SECRET_KEY: ${{ secrets.FIREBASE_SECRET_KEY }}
        run: |
          node -e '
          const fetch = require("node-fetch");
          const xml2js = require("xml2js");

          const parser = new xml2js.Parser({ explicitArray: false });

          // 各メディアの直接RSS/AtomフィードURL
          const FEEDS = [
            { type: "note", url: "https://note.com/andydandystory/rss" },
            { type: "yt-repair", url: "https://www.youtube.com/feeds/videos.xml?channel_id=UCnN8E4C4uQzY0y1g9N1y1A" },
            { type: "yt-talk", url: "https://www.youtube.com/feeds/videos.xml?channel_id=UC6iB8Oa-aD20QxG24G-A3Cg" }
          ];

          // YouTubeのハンドル名やユーザー名からチャンネルIDを安全に取得・解析する処理
          async function getYoutubeEntries(feed) {
            try {
              // ユーザーの公開再生リスト（アップロード動画一覧）から取得を試みる
              let url = "";
              if (feed.type === "yt-repair") {
                url = "https://www.youtube.com/feeds/videos.xml?playlist_id=UUMO" + "sato2525jd";
              } else if (feed.type === "yt-talk") {
                url = "https://www.youtube.com/feeds/videos.xml?playlist_id=UUMO" + "andydandystory";
              }
              
              const res = await fetch(url, { headers: { "User-Agent": "Mozilla/5.0" } });
              if (!res.ok) return [];
              const xml = await res.text();
              const result = await parser.parseStringPromise(xml);
              
              if (result && result.feed && result.feed.entry) {
                const entries = result.feed.entry;
                return Array.isArray(entries) ? entries : [entries];
              }
            } catch (e) {
              console.error("YouTube fetch failed:", feed.type, e.message);
            }
            return [];
          }

          async function main() {
            let allItems = [];

            // 1. noteの取得
            try {
              const res = await fetch("https://note.com/andydandystory/rss");
              if (res.ok) {
                const xml = await res.text();
                const result = await parser.parseStringPromise(xml);
                if (result && result.rss && result.rss.channel && result.rss.channel.item) {
                  const items = Array.isArray(result.rss.channel.item) ? result.rss.channel.item : [result.rss.channel.item];
                  items.forEach(item => {
                    let thumb = "";
                    if (item["media:thumbnail"]) {
                      thumb = item["media:thumbnail"];
                    } else if (item["media:content"] && item["media:content"].$) {
                      thumb = item["media:content"].$.url;
                    }
                    const pubDate = new Date(item.pubDate);
                    const formattedDate = pubDate.getFullYear() + "/" + 
                      String(pubDate.getMonth() + 1).padStart(2, "0") + "/" + 
                      String(pubDate.getDate()).padStart(2, "0");

                    allItems.push({
                      type: "note",
                      title: item.title,
                      link: item.link,
                      date: formattedDate,
                      timestamp: pubDate.getTime(),
                      thumbUrl: thumb
                    });
                  });
                }
              }
            } catch (e) {
              console.error("note fetch error:", e.message);
            }

            // 2. YouTube (ジャンク修理 & 雑談) の取得
            const ytFeeds = [
              { type: "yt-repair", handle: "sato2525jd" },
              { type: "yt-talk", handle: "andydandystory" }
            ];

            for (const yt of ytFeeds) {
              const entries = await getYoutubeEntries(yt);
              entries.forEach(entry => {
                let thumb = "";
                if (entry["media:group"] && entry["media:group"]["media:thumbnail"]) {
                  thumb = entry["media:group"]["media:thumbnail"].$.url;
                }
                const pubDate = new Date(entry.published || entry.updated);
                const formattedDate = pubDate.getFullYear() + "/" + 
                  String(pubDate.getMonth() + 1).padStart(2, "0") + "/" + 
                  String(pubDate.getDate()).padStart(2, "0");

                allItems.push({
                  type: yt.type,
                  title: entry.title,
                  link: entry.link.$.href,
                  date: formattedDate,
                  timestamp: pubDate.getTime(),
                  thumbUrl: thumb
                });
              });
            }

            // 日付の新しい順にソートして上位3件を抽出
            allItems.sort((a, b) => b.timestamp - a.timestamp);
            const topItems = allItems.slice(0, 3);

            // Firebase Realtime Database へ保存
            const dbUrl = process.env.FIREBASE_DATABASE_URL + "/whatsNew.json?auth=" + process.env.FIREBASE_SECRET_KEY;
            const putRes = await fetch(dbUrl, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(topItems)
            });

            if (putRes.ok) {
              console.log("Successfully updated whatsNew on Firebase!");
            } else {
              console.error("Firebase update failed:", await putRes.text());
            }
          }

          main();
          '